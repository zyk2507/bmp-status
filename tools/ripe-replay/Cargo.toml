[package]
name = "ripe-bgp-replay"
version = "0.1.0"
edition = "2024"
description = "Replay historical RIPE RIS routes into a RustyBGP Loc-RIB over gRPC (no kernel/FIB writes)"

[dependencies]
anyhow = "1"
bgpkit-parser = "0.22"
clap = { version = "4.6", features = ["derive"] }
oneio = { version = "0.26", default-features = false, features = ["http", "rustls"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
